<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Plan prototype</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'><circle cx='20' cy='20' r='20' fill='%235367FF'/><path d='M2.01 28.74L16 20l8 3.5 13.96-12.3A20 20 0 0 1 20 40 20 20 0 0 1 2.01 28.74z' fill='%2300F3BB'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#00B386;       /* brand accent: wordmark, Grow bucket */
  --accent-btn:#00A67E;   /* button fill, a touch deeper for white text */
  --accent-ink:#007F60;   /* green text on white */
  --accent-soft:#E8F7F2;
  --accent-line:#9FDCC9;
  --ink:#1F2933; --ink-2:#56616B; --ink-3:#848F99;
  --line:#E7EBEE; --line-2:#D5DBE0; --soft:#F5F7F8; --page:#E9EDF0;
  --loss:#D14343;         /* used only for the loss number */
  --keep:#4A67C7; --park:#E89B3A; --grow:#00B386; --learn:#A17AE0;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--page);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

/* ---------- page + device ---------- */
.stage{margin:auto;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:16px}
#deviceWrap{position:relative;flex:none;width:414px;height:868px}
#device{position:absolute;top:0;left:0;width:414px;height:868px;transform-origin:0 0;border-radius:60px;background:#14181C;padding:12px;box-shadow:0 30px 60px -24px rgba(16,24,32,.45),inset 0 0 0 1px #2C333A}
.phone{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#fff;isolation:isolate}

.statusbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:4px 28px 0 36px;z-index:30;font-weight:600;font-size:15px;letter-spacing:-.01em;pointer-events:none;background:#fff}
.island{position:absolute;left:50%;top:11px;width:120px;height:34px;margin-left:-60px;background:#0B0D0F;border-radius:20px}
.sb-icons{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:80;pointer-events:none;transition:background .3s}
.home-ind.light{background:#fff}

.viewport{position:absolute;top:50px;left:0;right:0;bottom:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:#fff;will-change:transform}
.screen.on{display:flex}

.hdr{flex:none;height:52px;display:flex;align-items:center;padding:0 12px;position:relative}
.hdr-title{position:absolute;left:88px;right:88px;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{margin-left:auto;position:relative;z-index:1;display:flex;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:transparent;display:grid;place-items:center;position:relative;z-index:1;color:var(--ink)}
.icon-btn:hover{background:var(--soft)}
.wordmark{color:var(--accent);font-weight:700;font-size:21px;letter-spacing:-.03em}
.brand{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.brand svg{flex:none;display:block}
.hdr-sell{height:34px;padding:0 18px;border-radius:17px;border:1px solid var(--line-2);background:#fff;font-weight:600;font-size:14px}
.hdr-sell:hover{background:var(--soft)}

.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 28px;scrollbar-width:none;overscroll-behavior:contain}
.body::-webkit-scrollbar{display:none}
.body.pad-home{padding-bottom:40px}
.ftr{flex:none;padding:12px 20px 30px;background:#fff;box-shadow:0 -1px 0 var(--line)}
.ftr>*+*{margin-top:8px}
.ftr-hint{margin:0 0 10px;text-align:center;font-size:13px;color:var(--ink-3)}

/* ---------- type ---------- */
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.01em;margin:0 0 6px}
.h1{font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.015em;margin:0}
.h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.01em;margin:0}
.lead{font-size:15px;line-height:22px;color:var(--ink-2);margin:8px 0 0}
.tiny{font-size:12px;line-height:17px;color:var(--ink-3);margin:0}
.hint{font-size:13px;line-height:19px;color:var(--ink-2);margin:10px 0 0}
.muted{color:var(--ink-2)}
.num,.b-amt,.legend b{font-variant-numeric:tabular-nums}
.center{text-align:center}
.sec-title{font-size:16px;font-weight:600;line-height:22px;margin:0}
.sec{margin-top:24px}

/* ---------- buttons ---------- */
.btn-primary{display:block;width:100%;height:52px;border-radius:12px;border:0;background:var(--accent-btn);color:#fff;font-weight:600;font-size:16px;transition:background .15s}
.btn-primary:hover:not(:disabled){background:#00976F}
.btn-primary:disabled{background:#C9D1D6;color:#fff}
.btn-secondary{display:block;width:100%;height:48px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-weight:600;font-size:15px;color:var(--ink)}
.btn-secondary:hover{background:var(--soft)}
.btn-dark{display:block;width:100%;height:52px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-weight:600;font-size:16px}
.link{background:none;border:0;color:var(--accent-ink);font-weight:600;font-size:15px;padding:10px 4px}
.link.block{display:block;width:100%;text-align:center}
.link-inline{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;font-size:14px}
.link:hover,.link-inline:hover{text-decoration:underline}

/* ---------- cards ---------- */
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.card.soft{background:var(--soft);border-color:transparent}
.card+.card{margin-top:12px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:20px;padding:6px 0}
.kv span{color:var(--ink-2)}
.kv b{font-weight:600;text-align:right}

/* ---------- screen 1 ---------- */
.success{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin-top:8px}
.success b{font-size:15px;font-weight:600;line-height:21px;display:block}
.success-ic{flex:none;width:32px;height:32px;border-radius:16px;background:var(--accent-btn);color:#fff;display:grid;place-items:center}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.job{border:1px solid var(--line);border-radius:14px;padding:14px}
.job-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);margin-bottom:10px}
.job b{display:block;font-size:15px;font-weight:600}
.job-desc{display:block;font-size:13px;line-height:18px;color:var(--ink-2);margin-top:2px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:20px;color:var(--ink-2);margin:20px 0 0}
.note svg{flex:none;margin-top:1px;color:var(--ink-3)}

/* ---------- explore ---------- */
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:12px;background:var(--soft);padding:0 14px;color:var(--ink-3);font-size:15px;margin-top:4px}
.ph-chips{display:flex;gap:8px;margin:16px 0}
.ph-chips span{padding:8px 12px;border-radius:18px;border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.sk-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sk-av{width:36px;height:36px;border-radius:10px;background:#EEF1F3;flex:none}
.sk-lines{flex:1}
.sk-lines i{display:block;height:10px;border-radius:5px;background:#EEF1F3}
.sk-lines i+i{margin-top:8px;width:55%}

/* ---------- chips, segmented, radios ---------- */
.q{margin-top:28px}
.q-label{font-size:16px;line-height:22px;font-weight:600;margin:0 0 12px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line-2);background:#fff;font-weight:500;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:#B9C2C9}
.chip[aria-checked="true"]{border-color:var(--accent-btn);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg .chip{justify-content:center}
.chip-row.tight{gap:7px}
.chip-row.tight .chip{padding:0 12px}
.radios{display:flex;flex-direction:column;gap:10px}
.radio,.check{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line-2);background:#fff;font-size:15px;line-height:21px;font-weight:500}
.radio:hover,.check:hover{border-color:#B9C2C9}
.radio-dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #AEB8C0;margin-top:1px;display:grid;place-items:center}
.radio[aria-checked="true"]{border-color:var(--accent-btn);background:var(--accent-soft)}
.radio[aria-checked="true"] .radio-dot{border-color:var(--accent-btn)}
.radio[aria-checked="true"] .radio-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent-btn)}
.check-box{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid #AEB8C0;margin-top:1px;display:grid;place-items:center;color:#fff}
.check[aria-checked="true"] .check-box{background:var(--ink-2);border-color:var(--ink-2)}
.check[aria-checked="true"]{background:var(--soft)}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:12px}

/* ---------- sliders ---------- */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;display:block;--v:0;--fill:var(--accent-btn)}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--fill) 0,var(--fill) calc(11px + (100% - 22px) * var(--v)),#E3E8EC calc(11px + (100% - 22px) * var(--v)),#E3E8EC 100%)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--fill);box-shadow:0 1px 4px rgba(16,24,32,.22);margin-top:-8px}
.rng::-moz-range-track{height:6px;border-radius:3px;background:#E3E8EC}
.rng::-moz-range-progress{height:6px;border-radius:3px;background:var(--fill)}
.rng::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--fill);box-shadow:0 1px 4px rgba(16,24,32,.22)}
.rng:focus-visible{outline:none}
.rng:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--fill) 30%,transparent)}
.rng-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin:6px 0 0}
.uneasy-read{font-size:16px;line-height:23px;margin:0 0 14px}
.uneasy-read b{font-size:18px}

/* ---------- screen 3 ---------- */
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:20px;margin:4px 0 12px}
.banner svg{flex:none;color:var(--accent-ink);margin-top:1px}
.owner{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:20px;font-weight:600;margin:4px 0 14px}
.owner svg{flex:none;color:var(--ink-2)}
.plan-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.plan-title{font-size:16px;font-weight:600}
.sum-ok{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
.sum-ok.off{color:var(--ink-2)}
.stack{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden;background:#fff}
.stack span{display:block;min-width:2px;transition:flex-grow .12s}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.legend div{font-size:12px;color:var(--ink-2);line-height:16px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend b{display:block;font-size:14px;color:var(--ink);font-weight:600;margin-top:2px}
.bucket{margin-top:12px}
.b-head{display:flex;align-items:center;gap:10px}
.b-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);flex:none}
.b-name{font-size:16px;font-weight:600;flex:1}
.b-amt{font-size:18px;font-weight:700}
.b-mean{font-size:14px;line-height:20px;color:var(--ink-2);margin:8px 0 12px}
.band-wrap{position:relative;height:4px;margin:6px 11px 0;border-radius:2px}
.band{position:absolute;top:0;bottom:0;border-radius:2px;background:#C3CBD2}
.band-label{font-size:12px;color:var(--ink-3);margin:6px 0 0}
.why{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.why summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--accent-ink);display:inline-flex;align-items:center;gap:4px;padding:4px 0}
.why summary::-webkit-details-marker{display:none}
.why summary svg{transition:transform .2s}
.why[open] summary svg{transform:rotate(180deg)}
.why p{font-size:13px;line-height:19px;color:var(--ink-2);margin:4px 0 2px}

/* ---------- screen 4 ---------- */
.keep-note{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:12px 14px;margin:18px 0 16px;font-size:14px;line-height:20px;color:var(--ink-2)}
.keep-note b{color:var(--ink);font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.tab{height:38px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,32,.12)}
.tab i,.b-dot{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.place{margin:16px 0 12px}
.place-row{font-size:15px;line-height:21px}
.place-row b{font-weight:700}
.meter{height:6px;border-radius:3px;background:#E3E8EC;margin-top:8px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:3px}
.cat-name{font-size:16px;font-weight:600}
.cat-what{font-size:14px;line-height:20px;color:var(--ink-2);margin:4px 0 10px}
.cat-fit{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);margin:0 0 12px}
.cat-fit svg{color:var(--ink-3)}
.foot-note{margin-top:16px}

/* ---------- order ---------- */
.fund-head{display:flex;gap:12px;align-items:center;margin:8px 0 18px}
.fund-av{width:44px;height:44px;border-radius:12px;background:#EEF1F3;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink-2);flex:none}
.fund-av.sm{width:30px;height:30px;border-radius:9px;font-size:11px}
.fund-name{font-size:17px;font-weight:600;line-height:23px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:600}
.tag .b-dot{background:var(--grow)}
.amt-label{display:block;font-size:14px;font-weight:600;margin:24px 0 8px}
.amt-field{display:flex;align-items:center;gap:6px;height:60px;border:1.5px solid var(--line-2);border-radius:14px;padding:0 16px;font-size:26px;font-weight:700}
.amt-field:focus-within{border-color:var(--accent-btn)}
.amt-field span{color:var(--ink-2)}
.amt-field input{flex:1;min-width:0;border:0;outline:0;font:inherit;color:var(--ink);background:transparent;font-variant-numeric:tabular-nums}
.amt-field input::placeholder{color:#B8C1C8}
.amt-msg{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:19px;color:var(--ink-2);margin:10px 0 0;min-height:19px}
.amt-msg svg{flex:none;margin-top:1px;color:var(--ink-3)}
.kv-list{margin-top:20px;border-top:1px solid var(--line);padding-top:8px}

/* ---------- screen 5 ---------- */
.s5-fund{font-size:15px;color:var(--ink-2);margin:12px 0 14px}
.s5-fund b{color:var(--ink)}
.claim{font-size:16px;line-height:24px;margin:0;font-weight:500}
.claim b{font-weight:700}
.callback{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;line-height:20px;color:var(--ink-2)}
.callback svg{flex:none;margin-top:1px;color:var(--ink-3)}
.callback p{margin:0}
.callback b{color:var(--ink);font-weight:600}

/* ---------- range scale (screens 5 & 6) ---------- */
.rs{position:relative;height:74px;margin:16px 0 6px}
.rs.has-marker{height:104px}
.rs-track{position:absolute;left:0;right:0;top:8px;height:10px;border-radius:5px;background:#F2F4F6}
.has-marker .rs-track{top:40px}
.rs-light,.rs-dark{position:absolute;top:0;bottom:0;border-radius:5px}
.rs-light{background:#D3DAE0}
.rs-dark{background:#8E99A4}
.rs-tick{position:absolute;top:-5px;width:2px;height:20px;margin-left:-1px;background:var(--ink);border-radius:1px}
.rs-marker{position:absolute;top:-9px;width:4px;height:28px;margin-left:-2px;border-radius:2px;background:var(--accent-btn);box-shadow:0 0 0 2px #fff}
.rs-pin{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--accent-btn);color:#fff;font-size:12px;font-weight:600;line-height:16px;padding:4px 9px;border-radius:8px}
.rs-pin::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--accent-btn)}
.rs-lab{position:absolute;top:30px;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:16px}
.has-marker .rs-lab{top:62px}
.rs-lab b{display:block;font-size:13px;font-weight:600}
.rs-lab span{display:block;font-size:12px;color:var(--ink-3)}
.rs-cap{font-size:14px;line-height:20px;margin:4px 0 10px;font-weight:500}
.rs-key{font-size:13px;line-height:19px;color:var(--ink-2);margin:0 0 10px}

/* ---------- screen 6 ---------- */
.hold-top{display:flex;align-items:center;gap:10px}
.hold-h{margin-top:14px;font-size:24px;line-height:30px}
.hold-chg{font-size:15px;margin:6px 0 16px}
.loss{color:var(--loss);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp{margin-top:12px}
.cmp-row{display:grid;grid-template-columns:104px 1fr 40px;align-items:center;gap:10px;font-size:14px;padding:5px 0}
.cmp-name{color:var(--ink-2)}
.cmp-track{height:10px;border-radius:5px;background:#F0F2F4;overflow:hidden}
.cmp-bar{height:100%;border-radius:5px}
.cmp-val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sec-note{font-size:14px;line-height:20px;margin:10px 0 0}
.decided-pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:14px;background:var(--soft);font-size:13px;font-weight:500}
.said{font-size:15px;line-height:22px;margin:0}
.said b{font-weight:600}
.actions{margin-top:28px}
.actions>*+*{margin-top:10px}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* ---------- done states ---------- */
.done{text-align:center;padding:28px 8px 24px}
.done-ic{width:64px;height:64px;border-radius:32px;background:var(--accent-soft);color:var(--accent-ink);display:inline-grid;place-items:center;margin-bottom:18px}
.done-ic.neutral{background:var(--soft);color:var(--ink-2)}
.label-sm{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;margin:0 0 6px}

/* ---------- portfolio ---------- */
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}

<script>
(function(){
'use strict';

/* ================= data ================= */
const ADDED = 40000;           // what Riya added on Screen 1
const UNEASY_BASE = 12000;     // "on every ₹12,000" (Riya's starting Grow amount)
const MARKET_PCT = 7;          // overall market fall over the same 3 weeks
const KEYS = ['keep','park','grow','learn'];

const DEFAULTS = {
  when:'notsure', cushion:'no', uneasy:10500, total:40000,
  split:{keep:15000, park:10000, grow:12000, learn:3000},
  tab:'grow', orderAmt:10000, invested:0, commit:null, ff:false,
  reflect:[], needAmt:null, needWhen:null, update:null
};

const BUCKETS = {
  keep:{name:'Keep', icon:'bank', band:[30,45], meaning:'Stays in your bank. Rent, surprises, your emergency cushion.'},
  park:{name:'Park', icon:'clock', band:[20,30], meaning:'Low-ups-and-downs options for money you may need within a year.'},
  grow:{name:'Grow', icon:'sprout', band:[25,40], meaning:"Money you won't need for 3+ years. Will rise and fall along the way."},
  learn:{name:'Learn', icon:'book', band:[0,10], meaning:"A capped amount to try picking stocks. Mistakes here won't hurt your plan."}
};

const WHEN = [['u3m','Under 3 months'],['3to12m','3–12 months'],['1to3y','1–3 years'],['3yplus','3+ years'],['notsure','Not sure']];
const CUSHION = [['yes','Yes'],['partly','Partly'],['no','No']];
const NEED_WHEN = [['week','This week'],['month','This month'],['few','In a few months']];
const NEED_WHEN_TXT = {week:' for this week', month:' for this month', few:' for the next few months'};
const COMMIT = [
  ['wait','Wait it out — this is 3+ year money'],
  ['recheck','Re-check why I bought it'],
  ['revisit',"It would mean I need the money — I'll revisit my plan"]
];
const REFLECT = [
  'Has your need for this money changed?',
  'Has your reason for buying changed, or just the price?',
  'Are you deciding while upset?'
];

const WHY = {
  keep:{
    no:"Many people keep 3–6 months of expenses before investing. You told us you don't have this yet, so Keep starts higher.",
    partly:"Many people keep 3–6 months of expenses before investing. You have some of this already, so Keep tops up the rest.",
    yes:"Many people keep 3–6 months of expenses before investing. You have this elsewhere, so Keep can stay smaller and cover this month's bills."
  },
  park:"Money you may need within a year usually goes where prices move less, so it's there when you need it.",
  grow:{
    u3m:"You said you may need this money within 3 months. Money needed that soon usually isn't put into things that rise and fall, so Grow can stay small.",
    '3to12m':"You may need this money within a year. Money needed that soon usually sits in Park, not Grow.",
    '1to3y':"You may need this money in 1–3 years. Grow is for money you can leave alone for 3+ years, so put here only the part you won't touch.",
    '3yplus':"You said this money can stay put for 3+ years. That's what Grow is for, so its range can go higher.",
    notsure:"You weren't sure when you'd need this money. Grow is for money you can leave alone for 3+ years, so put here only what you're sure about."
  },
  learn:"Many first-time investors set aside a small, fixed amount to try picking stocks. Keeping it capped means a mistake teaches you something without denting the rest."
};

const CATS = {
  grow:[
    {id:'largecap', name:'Large-cap index funds', what:"Track an index of India's largest listed companies. No fund manager picking."},
    {id:'flexicap', name:'Flexi-cap funds', what:'A fund manager picks companies of any size, and can change the mix.'},
    {id:'hybrid', name:'Hybrid funds', what:'Hold a mix of shares and bonds in one fund.'}
  ],
  park:[
    {id:'liquid', name:'Liquid funds', what:'Lend money for up to 91 days at a time. Usually easy to withdraw.'},
    {id:'shortdur', name:'Short-duration funds', what:'Lend money to companies and the government for a few years at a time.'},
    {id:'fd', name:'Fixed deposits', what:'A fixed rate for a fixed time, from a bank.', cta:'Explore FDs →'}
  ]
};
const FIT = {grow:"Fits money you won't need for 3+ years", park:'Fits money you may need within a year'};

/* screen order (for switcher + slide direction) */
const SCREENS = [
  {id:'s1', label:"What's this for", n:1},
  {id:'ex', label:'Explore'},
  {id:'s2', label:'When & cushion', n:2},
  {id:'s3', label:'Your split', n:3},
  {id:'s4', label:'Categories', n:4},
  {id:'pf', label:'Portfolio'},
  {id:'or', label:'Order'},
  {id:'s5', label:'Commit', n:5},
  {id:'inv', label:'Invested'},
  {id:'s6', label:'Check-in', n:6},
  {id:'nt', label:'Plan noted'},
  {id:'s7', label:'Need changed', n:7}
];
const ORDER = SCREENS.map(s => s.id);
const PARENT = {ex:'s1', s2:'s1', s3:'s2', s4:'s3', pf:'s4', or:'s4', s5:'or', inv:'s4', s6:'pf', nt:'s6', s7:'s6'};

/* ================= icons ================= */
const MARK = size => `<svg viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#5367FF"/><path d="M2.01 28.74L16 20l8 3.5 13.96-12.3A20 20 0 0 1 20 40 20 20 0 0 1 2.01 28.74z" fill="#00F3BB"/></svg>`;
const svg = (d, w=20, sw=1.9) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  back: svg('<path d="M15 5l-7 7 7 7"/>', 24, 2.2),
  check: svg('<path d="M5 12.5l4.2 4.2L19 7"/>', 18, 2.6),
  checkLg: svg('<path d="M5 12.5l4.2 4.2L19 7"/>', 30, 2.4),
  checkSm: svg('<path d="M5 12.5l4.2 4.2L19 7"/>', 13, 3),
  info: svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.2"/>', 18),
  bank: svg('<path d="M3 9.5L12 4l9 5.5"/><path d="M5.5 10.5v7M10 10.5v7M14 10.5v7M18.5 10.5v7"/><path d="M3.5 20h17"/>'),
  clock: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  clockSm: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', 15),
  sprout: svg('<path d="M12 20v-8"/><path d="M12 12c0-4.4 3-7 8-7 0 4.4-3 7-8 7z"/><path d="M12 14.5C12 11 9.6 9 5 9c0 3.5 2.4 5.5 7 5.5z"/>'),
  book: svg('<path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5"/>'),
  sliders: svg('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
  history: svg('<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4h4"/><path d="M12 8v4l2.8 1.7"/>', 18),
  chevDown: svg('<path d="M6 9l6 6 6-6"/>', 14, 2.4),
  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>', 18)
};
const SB_ICONS = `<svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
<svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.3c2.3 0 4.5.9 6.2 2.4l1.2-1.3A10.5 10.5 0 0 0 8 .5C5.2.5 2.6 1.6.6 3.4l1.2 1.3A8.8 8.8 0 0 1 8 2.3z"/><path d="M8 5.7c1.4 0 2.8.5 3.9 1.5l1.2-1.3A7.4 7.4 0 0 0 8 3.9c-1.9 0-3.7.7-5.1 2l1.2 1.3c1.1-1 2.5-1.5 3.9-1.5z"/><path d="M8 9c.6 0 1.1.2 1.5.5L8 11.2 6.5 9.5c.4-.3.9-.5 1.5-.5z"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg>`;

/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const r100 = n => Math.round(n / 100) * 100;
const r10 = n => Math.round(n / 10) * 10;

/* Indian digit grouping, done by hand (last 3 digits, then pairs): 1,20,000 */
function groupIN(n){
  const s = String(Math.round(Math.abs(n)));
  if (s.length <= 3) return s;
  const last3 = s.slice(-3);
  const rest = s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  return rest + ',' + last3;
}
function inr(n){ return (n < 0 ? '−' : '') + '₹' + groupIN(n); }
function inrRange(a, b){ return inr(a) + '–' + groupIN(b); }
function pctText(p){
  const twice = p * 2;
  if (Math.abs(twice - Math.round(twice)) < 1e-9) return String(Math.round(twice) / 2);
  return 'about ' + Math.round(p);
}
function dot(k){ return `<i class="b-dot" style="background:var(--${k})"></i>`; }

/* ================= state ================= */
let state = clone(DEFAULTS);
let hist = ['s1'];
let current = null;
let dragBase = null;

function sumSplit(sp = state.split){ return KEYS.reduce((s, k) => s + sp[k], 0); }
function available(){ return Math.max(0, state.split.grow - state.invested); }
function holdingAmt(){ return state.invested || state.orderAmt; }
function badLow(a){ return r100(a * 0.70); }
function badHigh(a){ return r100(a * 0.80); }
function fallValue(a){ return r100(a * 0.91); }
function fallPct(a){ return Math.round((a - fallValue(a)) / a * 100); }
function currentValue(){ const a = holdingAmt(); return state.ff ? fallValue(a) : a; }
function commitLabel(){ const c = COMMIT.find(c => c[0] === state.commit); return c ? c[1] : null; }

/* Rebalance: move one bucket, spread the rest over the other three in
   proportion to their values, in ₹500 steps, so the sum is exactly `total`. */
function rebalance(base, key, val, total){
  const STEP = 500;
  val = Math.max(0, Math.min(total, Math.round(val / STEP) * STEP));
  const others = KEYS.filter(k => k !== key);
  const rem = total - val;
  const baseSum = others.reduce((s, k) => s + base[k], 0);
  const raw = others.map(k => baseSum > 0 ? rem * base[k] / baseSum : rem / others.length);
  const out = raw.map(x => Math.floor(x / STEP) * STEP);
  let left = rem - out.reduce((a, b) => a + b, 0);
  const byRemainder = raw.map((x, i) => [x - out[i], i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  for (let j = 0; left >= STEP; j++){ out[byRemainder[j % byRemainder.length][1]] += STEP; left -= STEP; }
  if (left > 0) out[byRemainder[0][1]] += left;   // only when total isn't a multiple of ₹500
  const next = Object.assign({}, base, {[key]: val});
  others.forEach((k, i) => { next[k] = out[i]; });
  return next;
}

function computeDraw(n){
  let left = n; const d = {};
  KEYS.forEach(k => { const t = Math.min(left, state.split[k]); d[k] = t; left -= t; });
  d.short = left;
  return d;
}

function orderCheck(){
  const n = state.orderAmt, avail = available();
  if (!n) return {ok:false, msg:'Enter an amount.'};
  if (n < 100) return {ok:false, msg:'The minimum for this sample fund is ₹100.'};
  if (avail <= 0) return {ok:false, msg:"There's nothing left in Grow to place. You can change your plan first."};
  if (n > avail) return {ok:false, msg:`That's more than the ${inr(avail)} in Grow to place. Invest less, or change your plan first.`};
  return {ok:true, msg:`${inr(avail - n)} will stay in Grow to place.`};
}

/* ================= shared components ================= */
function shell(o){
  return `<header class="hdr">
      <button class="icon-btn back" data-act="back" aria-label="Back">${I.back}</button>

    </header>
    <div class="body${o.footer ? '' : ' pad-home'}">${o.body}</div>

}
function chip(group, value, label, on){
  return `<button class="chip" role="radio" aria-checked="${on}" data-act="${group}" data-arg="${value}">${on ? I.checkSm : ''}${label}</button>`;
}
function stackSegs(sp = state.split){
  const t = sumSplit(sp) || 1;
  return KEYS.filter(k => sp[k] > 0).map(k =>
    `<span style="flex:${sp[k]} 1 0px;background:var(--${k})" title="${BUCKETS[k].name} ${inr(sp[k])} (${Math.round(sp[k] / t * 100)}%)"></span>`).join('');
}
function legend(sp = state.split){
  return KEYS.map(k => `<div><i style="background:var(--${k})"></i>${BUCKETS[k].name}<b>${inr(sp[k])}</b></div>`).join('');
}
function sumOk(){
  const s = sumSplit();
  return s === state.total
    ? `${I.check}Adds up to ${inr(s)}`
    : `Adds up to ${inr(s)} of ${inr(state.total)}`;
}
function planCard(title, right){
  return `<div class="card plan-card">
      <div class="plan-top"><span class="plan-title">${title}</span>${right || `<span class="sum-ok" id="sumOk">${sumOk()}</span>`}</div>
      <div class="stack" id="stack" role="img" aria-label="${KEYS.map(k => BUCKETS[k].name + ' ' + inr(state.split[k])).join(', ')}">${stackSegs()}</div>
      <div class="legend" id="legend">${legend()}</div>

/* Range scale, used on Screen 5 (no marker) and Screen 6 (marker = current value) */
function rangeScale(amt, value){
  const lo = badLow(amt), hi = badHigh(amt);
  const min = amt * 0.6, max = amt * 1.06;
  const pos = v => ((v - min) / (max - min) * 100).toFixed(2);
  const marker = value != null;
  return `<div class="rs${marker ? ' has-marker' : ''}" role="img" aria-label="Bad-year low ${inrRange(lo, hi)}, invested ${inr(amt)}${marker ? ', now ' + inr(value) : ''}">
      <div class="rs-track">
        <div class="rs-light" style="left:${pos(lo)}%;width:${(pos(amt) - pos(lo)).toFixed(2)}%"></div>
        <div class="rs-dark" style="left:${pos(lo)}%;width:${(pos(hi) - pos(lo)).toFixed(2)}%"></div>
        <div class="rs-tick" style="left:${pos(amt)}%"></div>
        ${marker ? `<div class="rs-marker" style="left:${pos(value)}%"><span class="rs-pin">You are here · ${inr(value)}</span></div>` : ''}
      </div>
      <div class="rs-lab" style="left:${pos((lo + hi) / 2)}%"><b>${inrRange(lo, hi)}</b><span>bad-year low</span></div>
      <div class="rs-lab" style="left:${pos(amt)}%"><b>${inr(amt)}</b><span>invested</span></div>
    </div>`;
}

}
function needGuide(){
  const n = state.needAmt && state.needAmt <= state.total ? state.needAmt : 0;
  const d = n ? computeDraw(n) : null;
  const rows = KEYS.map((k, i) => {
    const take = d ? d[k] : 0;
    const hl = d ? take > 0 : (k === 'keep' || k === 'park');
    return `<li class="draw-row${hl ? ' hl' : (d ? ' dim' : '')}" data-draw="${k}">
        <span class="step-num">${i + 1}</span>
        <span class="draw-name">${dot(k)}${BUCKETS[k].name}</span>
        <span class="draw-amt">${inr(state.split[k])}</span>
        ${take > 0 ? `<span class="draw-take">Take ${inr(take)} · ${inr(state.split[k] - take)} left</span>` : ''}
      </li>`;
  }).join('');
  let growNote = '';
  if (d && d.grow > 0){
    const uninvested = available();
    growNote = d.grow > uninvested && state.invested
      ? `<p class="hint">Part of this would come from money already invested in Grow. You can sell it with "Sell from Grow" below.</p>`
      : `<p class="hint">This would also take ${inr(d.grow)} from Grow.</p>`;
  }
  return `<h2 class="sec-title">Where it usually comes from</h2>
    <p class="guide-text">People usually draw from Keep first, then Park, before Grow. Keep has ${inr(state.split.keep)} and Park has ${inr(state.split.park)}.</p>
    <ol class="draw-list" aria-label="Order to draw from">${rows}</ol>
    ${growNote}
    <p class="tiny" style="margin-top:12px">This is the usual order to draw from, not advice on any product.</p>`;
}

/* ================= sheets ================= */
const SHEETS = {
  sell(){
    const val = currentValue();
    return `<h2 class="sheet-title" id="sheetTitle">Sell Large-cap index fund (sample)</h2>
      <p class="hint" style="margin-top:0">From your Grow money</p>
      <div class="kv-list" style="margin-top:14px">
        <div class="kv"><span>Current value</span><b>${inr(val)}</b></div>
        <div class="kv"><span>Selling</span><b>All units</b></div>
      </div>
      <p class="tiny" style="margin-top:8px">Money from the sale goes to your Groww balance.</p>
      <div class="sheet-actions">
        <button class="btn-dark" data-act="sellConfirm">Sell ${inr(val)}</button>
        <button class="link block" data-act="closeSheet">Cancel</button>
      </div>`;
  },
  gr1(){
    const pct = fallPct(holdingAmt());
    return `<h2 class="sheet-title" id="sheetTitle">GR 1</h2>
      <div class="bubble">Why did my index fund fall ${pct}% in 3 weeks?</div>
      <div class="gr1-ph"><b style="color:var(--ink)">GR 1 would open here</b><br>with this fund and the last 3 weeks already in context. It isn't part of this prototype.</div>
      <div class="sheet-actions"><button class="btn-secondary" data-act="closeSheet">Close</button></div>`;
  }
};
function openSheet(kind){
  const s = $('#sheet');
  $('#sheetBody').innerHTML = SHEETS[kind]();
  s.hidden = false;
  void s.offsetWidth;
  s.classList.add('open');
  const f = s.querySelector('button'); if (f) f.focus({preventScroll:true});
}
function closeSheet(instant){
  const s = $('#sheet');
  if (s.hidden) return;
  s.classList.remove('open');
  if (instant || reducedMotion()) { s.hidden = true; return; }
  setTimeout(() => { if (!s.classList.contains('open')) s.hidden = true; }, 280);
}

/* ================= toast ================= */
let toastTimer;
function toast(msg){
  const t = $('#toast');
  const f = $('.screen.on .ftr');
  t.style.bottom = ((f ? f.offsetHeight : 40) + 12) + 'px';
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ================= lock screen ================= */
let lockTimer;
function showLock(){
  const l = $('#lock');
  clearTimeout(toastTimer); $('#toast').classList.remove('show');
  $('#notifTitle').textContent = `Your index fund is down ${fallPct(holdingAmt())}%`;
  l.classList.remove('show', 'notif-in');
  l.hidden = false;
  $('#homeInd').classList.add('light');
  void l.offsetWidth;
  l.classList.add('show');
  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => l.classList.add('notif-in'), reducedMotion() ? 0 : 650);
}
function hideLock(instant){
  const l = $('#lock');
  clearTimeout(lockTimer);
  $('#homeInd').classList.remove('light');
  if (l.hidden) return;
  l.classList.remove('show');
  if (instant || reducedMotion()) { l.hidden = true; l.classList.remove('notif-in'); return; }
  setTimeout(() => { l.hidden = true; l.classList.remove('notif-in'); }, 360);
}

/* ================= navigation ================= */
const screenEls = {};
function screenEl(id){
  if (!screenEls[id]){
    const el = document.createElement('section');
    el.className = 'screen';
    el.dataset.screen = id;
    $('#viewport').appendChild(el);
    screenEls[id] = el;
  }
  return screenEls[id];
}
function renderScreen(id){ screenEl(id).innerHTML = R[id](); }
function rerender(){
  const el = screenEl(current);
  const b = el.querySelector('.body');
  const top = b ? b.scrollTop : 0;
  renderScreen(current);
  const nb = el.querySelector('.body');
  if (nb) nb.scrollTop = top;
}
function reducedMotion(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

let navToken = 0, running = [];
function hideOthers(id){ Object.keys(screenEls).forEach(k => screenEls[k].classList.toggle('on', k === id)); }

function show(id, fromId, dir){
  running.forEach(a => a.cancel()); running = [];
  const token = ++navToken;
  renderScreen(id);
  const inEl = screenEl(id);
  current = id;
  paintSwitcher();
  Object.values(screenEls).forEach(e => { e.style.zIndex = ''; e.style.transform = ''; });
  if (!fromId || fromId === id || reducedMotion()){ hideOthers(id); return; }
  const outEl = screenEl(fromId);
  hideOthers(id); outEl.classList.add('on');
  const fwd = dir !== 'back';
  inEl.style.zIndex = fwd ? 2 : 1;
  outEl.style.zIndex = fwd ? 1 : 2;
  const opts = {duration:300, easing:'cubic-bezier(.22,.8,.24,1)'};
  const a1 = inEl.animate([{transform:`translateX(${fwd ? '100%' : '-28%'})`}, {transform:'translateX(0)'}], opts);
  const a2 = outEl.animate([{transform:'translateX(0)'}, {transform:`translateX(${fwd ? '-28%' : '100%'})`}], opts);
  running = [a1, a2];
  a1.onfinish = () => { if (token === navToken){ hideOthers(current); inEl.style.zIndex = ''; outEl.style.zIndex = ''; running = []; } };
}
function go(id){
  if (id === current){ rerender(); return; }
  hist.push(id);
  show(id, current, 'fwd');
}
function back(){
  if (current === 's1'){ toast("This would return to Add money. That screen isn't part of this prototype."); return; }
  const from = current;
  if (hist.length > 1 && hist[hist.length - 1] === current){
    hist.pop();
    show(hist[hist.length - 1], from, 'back');
  } else {
    const p = PARENT[current] || 's1';
    hist = [p];
    show(p, from, 'back');
  }
}
function jump(id){
  closeSheet(true); hideLock(true);
  if (['inv','s6','nt','s7'].includes(id) && !state.invested) state.invested = state.orderAmt;
  if (['s6','nt','s7'].includes(id)) state.ff = true;
  if (id === current){ rerender(); return; }
  const dir = ORDER.indexOf(id) < ORDER.indexOf(current) ? 'back' : 'fwd';
  hist.push(id);
  show(id, current, dir);
}
function reset(){
  state = clone(DEFAULTS);
  dragBase = null;
  closeSheet(true); hideLock(true);
  const from = current;
  hist = ['s1'];
  show('s1', from === 's1' ? null : from, 'back');
  toast('Prototype reset to Riya’s starting numbers.');
}

/* ================= switcher ================= */
function buildSwitcher(){
  SCREENS.forEach(s => {
    const b = document.createElement('button');
    b.className = 'sw' + (s.n ? '' : ' support');
    b.dataset.act = 'jump'; b.dataset.arg = s.id;
    b.innerHTML = s.n ? `<span class="n">${s.n}</span>${s.label}` : s.label;
    (s.n ? $('#swMain') : $('#swSupport')).appendChild(b);
  });
}
function paintSwitcher(){
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-current', String(b.dataset.arg === current)));
}

/* ================= actions ================= */
const ACT = {
  back, go, jump, reset,
  when(v){ state.when = v; rerender(); },
  cushion(v){ state.cushion = v; rerender(); },
  tab(v){ state.tab = v; rerender(); },
  commit(v){ state.commit = v; rerender(); },
  needWhen(v){ state.needWhen = state.needWhen === v ? null : v; rerender(); },
  reflect(v){
    const i = Number(v);
    state.reflect = state.reflect.includes(i) ? state.reflect.filter(x => x !== i) : state.reflect.concat(i);
    rerender();
  },
  savePlan(){ go(state.update ? 'pf' : 's4'); },
  explore(id){
    if (id === 'largecap') go('or');
    else toast('Only Large-cap index funds opens in this prototype.');
  },
  confirmInvest(){
    if (!state.commit || !orderCheck().ok) return;
    state.invested += state.orderAmt;
    state.ff = false;
    while (hist.length && ['s5','or'].includes(hist[hist.length - 1])) hist.pop();
    hist.push('inv');
    show('inv', current, 'fwd');
  },
  fastForward(){ showLock(); },
  openNotif(){
    state.ff = true;
    if (hist[hist.length - 1] === 'inv') hist.pop();
    hist.push('pf', 's6');
    show('s6', null);
    hideLock();
  },
  sell(){ openSheet('sell'); },
  gr1(){ openSheet('gr1'); },
  closeSheet(){ closeSheet(); },
  sellConfirm(){ closeSheet(); toast('Sell order placed. This is a prototype, so nothing was sold.'); },
  buyMore(){ toast("Buy more would open Groww's usual order screen. It isn't part of this prototype."); },
  updatePlan(){
    if (!needValid()) return;
    const n = state.needAmt, d = computeDraw(n);
    KEYS.forEach(k => { state.split[k] -= d[k]; });
    state.total -= n;
    state.update = {amt:n, when:state.needWhen, from:KEYS.filter(k => d[k] > 0), total:state.total};
    state.needAmt = null; state.needWhen = null;
    go('s3');
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (fn) fn(t.dataset.arg);
});

document.addEventListener('pointerdown', e => {
  if (e.target.matches && e.target.matches('input[data-input="split"]')) dragBase = clone(state.split);
});
document.addEventListener('pointerup', () => { dragBase = null; });
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input[data-input="split"]')) dragBase = null;
  if (e.key === 'Escape') closeSheet();
});

function digits(input){
  const raw = input.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 7);
  const n = raw ? parseInt(raw, 10) : 0;
  input.value = raw ? groupIN(n) : '';
  return n;
}

document.addEventListener('input', e => {
  const t = e.target, kind = t.dataset && t.dataset.input;
  if (!kind) return;
  if (kind === 'uneasy'){
    state.uneasy = Number(t.value);
    t.style.setProperty('--v', (state.uneasy - 6000) / 6000);
    t.setAttribute('aria-valuetext', inr(state.uneasy));
    $('#uneasyVal').textContent = inr(state.uneasy);
    $('#uneasyDrop').textContent = uneasyDropText(UNEASY_BASE - state.uneasy);
  } else if (kind === 'split'){
    state.split = rebalance(dragBase || state.split, t.dataset.k, Number(t.value), state.total);
    paintSplit();
  } else if (kind === 'orderAmt'){
    state.orderAmt = digits(t);
    const v = orderCheck();
    $('#orderMsg').innerHTML = `${I.info}<span>${v.msg}</span>`;
    $('#orderGo').disabled = !v.ok;
  } else if (kind === 'needAmt'){
    const n = digits(t);
    state.needAmt = n || null;
    $('#needMsg').innerHTML = needMsg();
    $('#needGuide').innerHTML = needGuide();
    $('#needGo').disabled = !needValid();
  }
});
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('input[data-input="split"]')) dragBase = null;
});

/* ================= fit the device to the window ================= */
function fit(){
  const W = 414, H = 868;
  const below = $('#below').offsetHeight;
  const availH = window.innerHeight - below - 48;
  const availW = window.innerWidth - 24;
  const s = Math.max(0.5, Math.min(1, availH / H, availW / W));
  $('#device').style.transform = s < 1 ? `scale(${s})` : '';
  const wrap = $('#deviceWrap');
  wrap.style.width = (W * s) + 'px';
  wrap.style.height = (H * s) + 'px';
}

/* ================= boot ================= */
$('#sbIcons').innerHTML = SB_ICONS;
$('#lockIcons').innerHTML = SB_ICONS;
buildSwitcher();
show('s1', null);
fit();
window.addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

window.MoneyPlan = { get state(){ return state; }, get history(){ return hist.slice(); }, get current(){ return current; }, groupIN, inr, rebalance };
})();
</script>
